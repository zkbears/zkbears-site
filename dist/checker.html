<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#75c4e3" />
    <meta name="description" content="ZKBEARS checker — coming soon." />
    <title>Checker — ZKBEARS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="checker-page">
    <header class="site-header">
      <a class="brand" href="./">ZKBEARS</a>
      <nav><a class="pixel-button" href="./">BACK HOME</a></nav>
    </header>
    <main class="checker-scene">
      <div class="checker-cloud checker-cloud--one" aria-hidden="true"></div>
      <div class="checker-cloud checker-cloud--two" aria-hidden="true"></div>
      <div class="checker-tree checker-tree--left" aria-hidden="true"></div>
      <div class="checker-tree checker-tree--right" aria-hidden="true"></div>
      <section class="soon-lockup" aria-labelledby="soon-title">
        <img src="./assets/checker-bear.png" alt="Smiling pixel bear resting its paws above the word Soon" />
        <h1 id="soon-title">SOON</h1>
      </section>
      <div class="checker-ground" aria-hidden="true"></div>
    </main>
  </body>
</html>
